<svg id="my-svg" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 592.328125 450" style="max-width: 592.328px; background-color: white;" role="graphics-document document" aria-roledescription="pie"><style>#my-svg{font-family:Inter,Helvetica,Arial,sans-serif;font-size:15px;fill:#0b1b3a;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#my-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#my-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#my-svg .error-icon{fill:#f8fafc;}#my-svg .error-text{fill:#070503;stroke:#070503;}#my-svg .edge-thickness-normal{stroke-width:1px;}#my-svg .edge-thickness-thick{stroke-width:3.5px;}#my-svg .edge-pattern-solid{stroke-dasharray:0;}#my-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#my-svg .edge-pattern-dashed{stroke-dasharray:3;}#my-svg .edge-pattern-dotted{stroke-dasharray:2;}#my-svg .marker{fill:#475569;stroke:#475569;}#my-svg .marker.cross{stroke:#475569;}#my-svg svg{font-family:Inter,Helvetica,Arial,sans-serif;font-size:15px;}#my-svg p{margin:0;}#my-svg .pieCircle{stroke:#1E293B;stroke-width:1px;opacity:1;}#my-svg .pieCircle.highlighted{scale:1.05;opacity:1;}#my-svg .pieCircle.highlightedOnHover:hover{transition-duration:250ms;scale:1.05;opacity:1;}#my-svg .pieOuterCircle{stroke:#1E293B;stroke-width:2px;fill:none;}#my-svg .pieTitleText{text-anchor:middle;font-size:25px;fill:#0b1b3a;font-family:Inter,Helvetica,Arial,sans-serif;}#my-svg .slice{font-family:Inter,Helvetica,Arial,sans-serif;fill:#0b1b3a;font-size:17px;}#my-svg .legend text{fill:#0b1b3a;font-family:Inter,Helvetica,Arial,sans-serif;font-size:17px;}#my-svg .node .neo-node{stroke:#1d4ed8;}#my-svg [data-look="neo"].node rect,#my-svg [data-look="neo"].cluster rect,#my-svg [data-look="neo"].no