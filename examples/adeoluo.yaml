sections: [header, stack, path, ecosystem, flagships, categories, languages, releases]

intro:
  path: >-
    What do you want to explore? Colors group projects by the stage of the stack they live in,
    and the same colors are used in every diagram on this page. Flagships are in bold.
  ecosystem: >-
    The projects compose into one pipeline: data is tokenized and deduplicated, models are trained
    and aligned, results are retrieved and served, agents act on them, and everything is evaluated,
    traced, and reproducible. Dotted arrows are cross-cutting relationships. Colors match the legend.
  flagships: >-
    Each flagship pairs an implementation with independent, reproducible evidence that it is correct.
    Results that are not wins are reported as they are.
  languages: >-
    Bytes of code per language, summed across my public repositories with the GitHub languages API.
    Forks are excluded.
  releases: Repositories with a tagged release. Badges link to the release page.
  stack: >-
    Languages and tools used in these repositories. Libraries marked reference are what my
    implementations are validated against, not what they are built on.

footer: Generated by profile-forge from live repository metadata.

