flagships:
  - repo: transformer-from-scratch
    summary: A decoder-only transformer and a reverse-mode autodiff engine
    result: Gradients match **PyTorch to < 1e-9**; learns real text to **3.64 bits/char** vs a 4.30 baseline; checkpointing
  - repo: evaluation-harness
    summary: A model and agent evaluation framework
    result: "Statistics cross-checked against **scipy to machine precision**: bootstrap CIs, McNemar, Cohen's d"
  - repo: ann-vector-search-library
    summary: HNSW approximate nearest neighbor search
    result: "**Matches hnswlib's recall** at matched parameters; latency curves vs hnswlib and FAISS reported as measured"
  - repo: rlhf-reward-model
    summary: Reward modeling with PPO
    result: A Bradley-Terry reward model, clipped PPO, and a **reward over-optimization (Goodhart) study**
  - repo: constrained-generation-library
    summary: Schema-constrained decoding via compiled automata
    result: "**240 of 240** outputs validate against the `jsonschema` reference; agree on 2,008 cases"
  - repo: llm-gateway
    summary: "An LLM gateway: safety, caching, reliability"
    result: Retry and failover, **per-tenant isolation**, injection and PII detection, concurrency-tested
  - repo: hybrid-rag
    summary: Hybrid retrieval with a trained dense retriever
    result: "Full evaluation suite; the dense retriever ties recall but ranks below strong lexical baselines at this scale"
  - repo: react-agent
    summary: A ReAct reasoning-and-acting agent
    result: "**Adversarial** tool-use robustness, recovery, and a benchmark against a single-shot baseline"
  - repo: training-provenance
    summary: Content-addressed ML reproducibility and lineage
    result: End-to-end reproduce, crash recovery, and an exhaustive **tamper-detection matrix**
  - repo: multi-agent-orchestrator
    summary: Planner, worker, and critic over a shared blackboard
    result: "**Durable execution** with resume, and a single-agent vs orchestrator comparison"
  - repo: vectordb-go
    summary: A persistent HNSW vector database server in Go
    result: Checksummed write-ahead log, snapshot and replay crash recovery, benchmarked against hnswlib and FAISS

