flagships:
  - repo: agent-platform
    summary: An integrated AI platform composed from nine of these libraries
    result: "OpenAI and Anthropic failover, streamed agent steps, an MCP server, and per-tenant memory; a worker **killed mid-job resumes without re-running steps** (SIGKILL test in CI)"
  - repo: transformer-from-scratch
    summary: A decoder-only transformer and a reverse-mode autodiff engine
    result: "Matches **PyTorch to < 1e-9**; **3.64 bits/char** on real text vs 4.30; a pre-registered 8-seed study whose induction hypothesis was **not supported**"
  - repo: evaluation-harness
    summary: A model and agent evaluation framework
    result: "Statistics cross-checked against **SciPy to machine precision**: bootstrap CIs, McNemar, and Cohen's d"
  - repo: ann-vector-search-library
    summary: An HNSW approximate nearest neighbor library with a Rust core
    result: "**Matches hnswlib's recall** on 100,000 SIFT vectors, and the default Rust core answers **1.2 to 1.5x faster** on ARM, where hnswlib runs without SIMD"
  - repo: rlhf-reward-model
    summary: A reward model with PPO and DPO policy optimization
    result: "A head-to-head PPO vs DPO comparison on the same preference task, and a **reward over-optimization (Goodhart) study**"
  - repo: constrained-generation-library
    summary: A schema-constrained decoder built on compiled automata
    result: "**240 of 240** outputs validate against the `jsonschema` reference; the two agree on 2,008 cases"
  - repo: llm-gateway
    summary: A safety gateway for LLM APIs, with a Go reverse proxy
    result: "Retry and failover, **per-tenant isolation**, and injection and PII defenses; the Go proxy matches the Python rules on every parity case"
  - repo: hybrid-rag
    summary: A hybrid retrieval system evaluated on the BEIR benchmark
    result: "Stemmed BM25 scores **0.687 nDCG@10 on SciFact**, above the published BEIR baseline of 0.665, and answers **about 200x faster than rank_bm25** on 171,000 documents"
  - repo: react-agent
    summary: A ReAct reasoning-and-acting agent
    result: "**Adversarial** tool-use robustness, recovery, and a benchmark against a single-shot baseline"
  - repo: training-provenance
    summary: A content-addressed reproducibility and lineage system for ML
    result: "End-to-end reproduction, crash recovery, and an exhaustive **tamper-detection matrix**"
  - repo: multi-agent-orchestrator
    summary: A planner, workers, and a critic over a shared blackboard
    result: "**Durable execution** with resume, and a single-agent vs orchestrator comparison"
  - repo: corpus-dedup-library
    summary: Near-duplicate detection for training corpora, with a Rust core
    result: "Deduplicates **1.4 million C4 documents in 30 seconds**; exact mode reaches **precision 1.000** and runs **13.7x faster than datasketch**"
  - repo: bpe-tokenizer-library
    summary: A byte-level BPE tokenizer with a Rust core that matches its Python reference token for token
    result: "Trains a **50,257-token vocabulary on 100 MB of C4 in 6.7 seconds** and encodes **faster than tiktoken** in batch (68.5 vs 52.4 MB/s)"
  - repo: vectordb-go
    summary: A persistent HNSW vector database server in Go (`brew install adeoluo/tap/vectordb`)
    result: "On **one million SIFT vectors**, NEON kernels answer **1.3 to 3.5x faster than hnswlib** at similar recall on ARM; checksummed write-ahead log and crash recovery"
  - repo: llm-vuln-scanner
    summary: A vulnerability scanner for LLM applications and agents, mapped to OWASP LLM Top 10 2026, OWASP Agentic Top 10 2026, and MITRE ATLAS
    result: "Scans **five current local models** (Qwen3.5 0.8B to 4B, Gemma 4 E2B, Granite 4.2 3B) with 540 attacks each, 42% to 50% succeeding; hardening the demo app cuts successful attacks **from 81 to 37 of 222**; compared with garak 0.17.1 on the same model"
  - repo: prompt-injection-detector
    summary: A prompt-injection detector trained on 13 public datasets, with a Rust n-gram scorer
    result: "**AUROC 0.9996** and **99.5% of attacks caught at 1% FPR** on 91,089 held-out prompts in **27 microseconds** per prompt; the published protectai DeBERTa model catches 87.6% on the same split"
  - repo: mcp-security-scanner
    summary: A static and live security scanner for Model Context Protocol servers, in Go
    result: "**Recall 1.00 at a 2% false positive rate** on 432 planted vulnerable servers, where Semgrep 1.184 finds 59% of command injection and none of the path traversal; the hard tier it misses is reported"
  - repo: learning-to-rank
    summary: LambdaMART with a Rust histogram core, neural rankers, and unbiased learning to rank
    result: "**NDCG@10 0.503** over five folds of MSLR-WEB10K (1.2 million documents), against LightGBM 0.504 and XGBoost 0.506 with identical settings; 500 trees train in 68 s versus 82 s for XGBoost"

