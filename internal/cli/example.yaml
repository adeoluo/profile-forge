# profile-forge example config.
# Generate with: profile-forge generate --config profile.yaml --out README.md
# Every repo named below must be a public repository owned by "user".
# Em and en dashes are rejected; use commas, colons, or hyphens.

user: octocat
name: The Octocat
headline: Example profile generated by profile-forge
bio: |
  A short paragraph about what you build and how you validate it.
  Keep it calm and specific.

links:
  - label: GitHub
    url: https://github.com/octocat

# shields.io static badges (label, message, color, optional logo and style).
badges:
  - label: built with
    message: Go
    color: "00ADD8"
    logo: go

# Any subset of: header, path, ecosystem, flagships, categories, languages, releases.
sections: [header, path, ecosystem, flagships, categories, languages, releases]

intro:
  flagships: The projects I would show first.

# color is the mermaid node fill; stroke and text are optional.
# color_name is the word used in the legend so every color is explained.
categories:
  - id: web
    title: Web and pages
    color_name: blue
    color: "#dbeafe"
    stroke: "#1d4ed8"
    text: "#0b1b3a"
    description: Static sites and front-end experiments.
    repos: [Spoon-Knife, octocat.github.io]
  - id: demos
    title: Demos and samples
    color_name: green
    color: "#dcfce7"
    stroke: "#15803d"
    text: "#052e16"
    description: Small repositories used to demonstrate GitHub features.
    repos: [Hello-World, git-consortium]

flagships:
  - repo: Spoon-Knife
    summary: The repository everyone forks first.
    result: Forked many times; used in the GitHub forking guide.

ecosystem:
  direction: LR
  aliases:
    octocat.github.io: pages site
  edges:
    - from: Hello-World
      to: Spoon-Knife
    - from: Spoon-Knife
      to: octocat.github.io
      label: links to
      style: dotted

languages:
  top: 6

path:
  prompt: What do you want to explore?
  max_others: 3

# Public repos deliberately left out of every category.
ignore: [hello-worId, test-repo1]
